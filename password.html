<head>

  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

      <a class="navbar-brand fw-bold" href="index.html">
        🛡️ Cyber_Wai
      </a>

      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">الرئيسية</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="guides.html">دليل الحماية</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="password.html">فحص كلمة المرور</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="quiz.html">اختبار الاحتيال</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">أرقام الإبلاغ</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">

    <h1 class="text-primary mb-4">
      🔐 فحص قوة كلمة المرور
    </h1>

    <p class="lead">
      أدخل كلمة المرور لمعرفة مدى قوتها.
    </p>

    <div class="card shadow-sm">
      <div class="card-body">

        <label for="passwordInput" class="form-label">
          كلمة المرور
        </label>

        <input
          type="password"
          id="passwordInput"
          class="form-control"
          placeholder="أدخل كلمة المرور"
          oninput="checkStrength()"
        >

        <div class="progress mt-3">
          <div
            id="strengthBar"
            class="progress-bar"
            style="width: 0%">
          </div>
        </div>

        <p id="strengthMessage" class="mt-3 fw-bold">
          أدخل كلمة المرور للفحص
        </p>

      </div>
    </div>

    <div class="text-center mt-4">

      <a href="quiz.html" class="btn btn-success btn-lg">
        ابدأ اختبار الاحتيال
      </a>

    </div>

  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">
      Cyber_Wai © 2025 — مشروع توعية أمنية
    </p>
  </footer>

  <script src="script.js"></script>
